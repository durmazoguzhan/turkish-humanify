name: ci

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Repository layout
        run: ./scripts/check-structure.sh

      - name: Counter agrees with the hand-verified fixture
        run: ./evals/test-count.sh

      - name: Every register-dependent rule states its own dose
        run: ./scripts/check-doses.sh

      # On master the version is fully determined: it is the commit count in
      # WendtVer form, so it can be recomputed and compared exactly.
      - name: Version matches the commit count
        if: github.event_name == 'push'
        run: ./scripts/version.sh --check

      # On a pull request HEAD is a synthetic merge commit, so HEAD's own count
      # is not meaningful. What *is* determined is the landing count: squash is
      # the only merge method this repository allows, so every pull request adds
      # exactly one commit to the base branch no matter how many it carries.
      #
      # This check used to ask only whether the version had moved forward, which
      # is not enough. A branch of four commits whose author computed the version
      # from its own HEAD passes that test with a bump of four, and then fails
      # the push gate on master, after the merge, when there is nothing left to
      # fix cheaply. One pull request is one commit is one PATCH.
      - name: Version bumped by exactly one
        if: github.event_name == 'pull_request'
        env:
          BASE: ${{ github.base_ref }}
        run: |
          set -euo pipefail
          read_version() { python3 -c "import json,sys;print(json.load(sys.stdin).get('version',''))"; }
          encode() { printf '%d.%d.%d' "$(( $1 / 100 ))" "$(( ($1 / 10) % 10 ))" "$(( $1 % 10 ))"; }

          git fetch --no-tags --quiet origin "$BASE"

          base_count=$(git rev-list --count FETCH_HEAD)
          want=$(encode "$(( base_count + 1 ))")

          base=$(git show "FETCH_HEAD:.claude-plugin/plugin.json" | read_version)
          head=$(read_version < .claude-plugin/plugin.json)

          printf 'base %s (%s commits) -> head %s; squashed landing count %s\n' \
            "${base:-<unset>}" "$base_count" "${head:-<unset>}" "$(( base_count + 1 ))"

          if ! printf '%s' "$head" | grep -qE '^[0-9]+\.[0-9]\.[0-9]$'; then
            echo "FAIL version '$head' is not WendtVer (MAJOR.MINOR.PATCH, MINOR and PATCH single digits)" >&2
            echo "     see scripts/version.sh and https://wendtver.org" >&2
            exit 1
          fi

          if [ "$head" != "$want" ]; then
            echo "FAIL version is $head; a squash merge onto $BASE makes $base_count + 1 commits, which is $want" >&2
            echo "     run: scripts/version.sh --write" >&2
            echo "     one pull request lands as one commit, so it carries exactly one PATCH" >&2
            exit 1
          fi

          echo "ok   version $head is $BASE + 1 squashed commit"

  # A merge to master is a release. The tag is the version, which is the commit
  # count, so nothing here is decided by hand either.
  release:
    needs: check
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Tag and release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          version=$(python3 -c "import json;print(json.load(open('.claude-plugin/plugin.json'))['version'])")
          tag="v$version"

          if git rev-parse "$tag" >/dev/null 2>&1; then
            echo "ok   $tag already exists, nothing to release"
            exit 0
          fi

          git tag "$tag"
          git push origin "$tag"
          gh release create "$tag" --title "$tag" --generate-notes
          echo "ok   released $tag"
